name: Build packages

on:
  push:
    branches: [ '**' ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# Every job runs once per OpenWrt release: 25.12 installs .apk packages with
# apk, 24.10 .ipk packages with opkg. Both sets go into the same release.
env:
  # The packages are architecture independent (PKGARCH:=all), so the SDK of
  # any target produces packages that install on every router.
  SDK_TARGET: x86/64
  PACKAGES: luci-app-wifisetup luci-app-tether luci-app-wireguard-passwall

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        openwrt: [ '25.12.2', '24.10.8' ]
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake libjson-c-dev jq qrencode

      # libubox, ubus, uci, ucode and rpcd at the exact revisions of the
      # OpenWrt release: newer ucode accepts syntax that the router's ucode
      # rejects, so testing against upstream HEAD is not enough.
      - name: Build OpenWrt ubus/uci/ucode/rpcd
        run: sudo -E ./tests/lib/build-stack.sh

      # Load the plugins into a real rpcd; fake iwinfo / network.wireless /
      # network.interface / hostapd objects stand in for Wi-Fi hardware.
      - name: Integration test (Wi-Fi Setup, iPhone Tethering)
        run: sudo -E SKIP_BUILD=1 ./tests/integration.sh

      - name: Integration test (WireGuard + Passwall)
        run: sudo -E SKIP_BUILD=1 ./tests/wgpasswall/integration.sh

      - name: Unit tests (release ucode)
        run: ./tests/run.sh

      - name: Relay test (stub SOCKS5 proxy)
        run: ./tests/wgpasswall/relay_test.sh

      - name: Syntax check JavaScript, JSON and shell
        run: |
          for f in $(find luci-app-*/htdocs -name '*.js'); do node --check "$f"; done
          for f in $(find luci-app-*/root -name '*.json'); do python3 -m json.tool "$f" >/dev/null; done
          for f in luci-app-*/root/etc/hotplug.d/*/* luci-app-*/root/etc/init.d/*; do sh -n "$f"; done

  build:
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - openwrt: '25.12.2'
            format: apk
          - openwrt: '24.10.8'
            format: ipk
    env:
      OPENWRT_VERSION: ${{ matrix.openwrt }}
    # the same number in every matrix job
    outputs:
      release: ${{ steps.rel.outputs.num }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The package release number (the "-rN" in 1.1.0-rN) is the number of
      # commits on the built branch, so every merge to main gets a higher
      # one and nobody has to bump PKG_RELEASE by hand. It is passed to make
      # on the command line, which overrides the Makefile's PKG_RELEASE.
      - name: Determine release number
        id: rel
        run: |
          num=$(git rev-list --count HEAD)
          echo "num=$num" >> "$GITHUB_OUTPUT"
          echo "REL_NUM=$num" >> "$GITHUB_ENV"
          echo "Package release: r$num"

      - name: Install SDK dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget zstd xz-utils

      - name: Locate SDK
        id: sdk
        run: |
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}"
          file=$(curl -fsSL "$base/sha256sums" | grep -oE 'openwrt-sdk-[^ ]+\.tar\.(zst|xz)' | head -n1)
          [ -n "$file" ] || { echo "No SDK found for OpenWrt ${OPENWRT_VERSION}"; exit 1; }
          echo "url=$base/$file" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "Using $file"

      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/${{ steps.sdk.outputs.file }}
          key: ${{ steps.sdk.outputs.file }}

      - name: Download and unpack SDK
        run: |
          archive="$RUNNER_TEMP/${{ steps.sdk.outputs.file }}"
          [ -f "$archive" ] || wget -q -O "$archive" "${{ steps.sdk.outputs.url }}"
          base="https://downloads.openwrt.org/releases/${OPENWRT_VERSION}/targets/${SDK_TARGET}"
          expected=$(curl -fsSL "$base/sha256sums" | grep " \*${{ steps.sdk.outputs.file }}\$" | cut -d' ' -f1)
          echo "$expected  $archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/sdk"
          tar -xf "$archive" -C "$RUNNER_TEMP/sdk" --strip-components=1

      # Smaller pages on the router. LuCI reads the "use strict" / "require"
      # strings at the top of a view from its source before running it, so
      # terser must keep them (directives=false); views end in a bare return.
      # The tests run on the readable sources.
      - name: Minify page scripts
        run: |
          for f in $(find luci-app-*/htdocs -name '*.js'); do
            npx --yes terser@5.36.0 "$f" --parse bare_returns --compress directives=false \
              --mangle --comments false -o "$f.min"
            head -c 200 "$f.min" | grep -q '^"use strict";"require ' || { echo "require lines lost in $f"; exit 1; }
            mv "$f.min" "$f"
          done

      - name: Prepare SDK
        working-directory: ${{ runner.temp }}/sdk
        run: |
          # No feeds on purpose: the packages only ship scripts, and the
          # dependencies (luci-base, qrencode, wireguard-tools, ...) are recorded from
          # DEPENDS verbatim. Installing feeds would make the SDK compile all
          # of them, including kernel modules, from source.
          for p in $PACKAGES; do ln -s "$GITHUB_WORKSPACE/$p" "package/$p"; done
          make defconfig

      - name: Build packages
        working-directory: ${{ runner.temp }}/sdk
        run: |
          for p in $PACKAGES; do make "package/$p/compile" PKG_RELEASE="$REL_NUM" V=s -j1; done

      - name: Collect packages
        working-directory: ${{ runner.temp }}/sdk
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for p in $PACKAGES; do
            pkg=$(find bin/packages -name "${p}-*.apk" -o -name "${p}_*.ipk" | head -n1)
            [ -n "$pkg" ] || { echo "Package $p not found"; find bin -type f; exit 1; }
            case "$pkg" in
              *"-r${REL_NUM}.apk"|*"-r${REL_NUM}_all.ipk") ;;
              *) echo "Package $pkg does not carry release r${REL_NUM}"; exit 1 ;;
            esac
            cp "$pkg" "$GITHUB_WORKSPACE/dist/"
            # show metadata (dependencies) in the build log
            if [ -x staging_dir/host/bin/apk ]; then
              staging_dir/host/bin/apk adbdump "$pkg" | tee meta.txt
              grep -q 'rpcd-mod-ucode' meta.txt || { echo "Dependencies missing from $p metadata"; exit 1; }
              # rpcd ignores world-writable plugins, so never ship such files
              if grep -nE 'mode: *0?[0-7]?[0-7][0-7][2367]([^0-7]|$)' meta.txt; then
                echo "World-writable files in $p"; exit 1
              fi
            else
              tar -xzOf "$pkg" ./control.tar.gz | tar -xzOf - ./control | tee meta.txt
              grep -q '^Depends:.*rpcd-mod-ucode' meta.txt || { echo "Dependencies missing from $p metadata"; exit 1; }
              tar -xzOf "$pkg" ./data.tar.gz | tar -tvzf - | tee files.txt
              if grep -E '^[^l].......w' files.txt; then
                echo "World-writable files in $p"; exit 1
              fi
            fi
          done

      # OpenWrt never signs single .apk files, so a self-built package needs
      # --allow-untrusted, which LuCI's "Upload package" cannot pass. Signing
      # it with our own key (repository secret APK_SIGNING_KEY, an EC
      # prime256v1 private key in PEM format) makes it trusted by any router
      # that has the public key in /etc/apk/keys. A signed index
      # (packages.adb) lets the router use the release as a package feed.
      - name: Sign package and index
        if: matrix.format == 'apk'
        working-directory: ${{ runner.temp }}/sdk
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          if [ -z "$APK_SIGNING_KEY" ]; then
            echo "::warning::APK_SIGNING_KEY secret not set: the package is unsigned and needs 'apk add --allow-untrusted'"
            exit 0
          fi
          APK="$PWD/staging_dir/host/bin/apk"
          keys="$RUNNER_TEMP/keys"
          mkdir -p "$keys"
          (umask 077; printf '%s\n' "$APK_SIGNING_KEY" > "$RUNNER_TEMP/signing-key.pem")
          openssl ec -in "$RUNNER_TEMP/signing-key.pem" -pubout -out "$keys/luci-apps.pem"
          cd "$GITHUB_WORKSPACE/dist"
          # one file per call: given several, apk 3.0.5 only signs the first
          for f in ./*.apk; do
            "$APK" adbsign --allow-untrusted --sign-key "$RUNNER_TEMP/signing-key.pem" "$f"
          done
          "$APK" verify --keys-dir "$keys" ./*.apk
          "$APK" mkndx --keys-dir "$keys" --sign-key "$RUNNER_TEMP/signing-key.pem" --output packages.adb ./*.apk
          cp "$keys/luci-apps.pem" .
          rm -f "$RUNNER_TEMP/signing-key.pem"
          ls -l
          # the public key is not secret; print it so it can be copied
          echo "Public key (luci-apps.pem):"
          cat luci-apps.pem

      # opkg installs single .ipk files without a signature, so LuCI's
      # "Upload package" works as is. To use the release as a package feed,
      # opkg needs a package index (Packages.gz) signed with a usign key
      # (repository secret OPKG_SIGNING_KEY, a usign / signify secret key
      # without a passphrase). signify-openbsd makes the same keys and
      # signatures as OpenWrt's usign.
      - name: Index and sign packages (opkg)
        if: matrix.format == 'ipk'
        env:
          OPKG_SIGNING_KEY: ${{ secrets.OPKG_SIGNING_KEY }}
        run: |
          printf '#!/bin/sh\nsha256sum "$2" | cut -d" " -f1\n' > "$RUNNER_TEMP/mkhash"
          chmod +x "$RUNNER_TEMP/mkhash"
          cd dist
          # the same index OpenWrt's "make package/index" writes
          MKHASH="$RUNNER_TEMP/mkhash" "$RUNNER_TEMP/sdk/scripts/ipkg-make-index.sh" . > Packages.manifest
          grep -vE '^(Maintainer|LicenseFiles|Source|SourceName|Require|SourceDateEpoch)' Packages.manifest > Packages
          rm Packages.manifest
          # usign miscomputes signatures of files of these lengths; OpenWrt pads them the same way
          case "$(((64 + $(stat -L -c%s Packages)) % 128))" in 110|111) printf '\n\n' >> Packages ;; esac
          gzip -9nc Packages > Packages.gz
          cat Packages
          if [ -z "$OPKG_SIGNING_KEY" ]; then
            echo "::warning::OPKG_SIGNING_KEY secret not set: the opkg package index is unsigned, so the release cannot be used as an opkg feed"
            exit 0
          fi
          sudo apt-get install -y signify-openbsd
          (umask 077; printf '%s\n' "$OPKG_SIGNING_KEY" > "$RUNNER_TEMP/opkg-key.sec")
          # the public key is in the secret key: algorithm, key number and the
          # second half of the Ed25519 secret key
          python3 - "$RUNNER_TEMP/opkg-key.sec" > luci-apps-opkg.pub <<'PY'
          import base64, sys
          k = base64.b64decode(open(sys.argv[1]).read().split('\n')[1])
          print('untrusted comment: luci-apps opkg public key')
          print(base64.b64encode(k[0:2] + k[32:40] + k[72:104]).decode())
          PY
          signify-openbsd -S -s "$RUNNER_TEMP/opkg-key.sec" -m Packages -x Packages.sig
          signify-openbsd -V -p luci-apps-opkg.pub -m Packages -x Packages.sig
          rm -f "$RUNNER_TEMP/opkg-key.sec"
          ls -l
          echo "Public key (luci-apps-opkg.pub):"
          cat luci-apps-opkg.pub

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-apps-openwrt-${{ env.OPENWRT_VERSION }}
          path: dist/*
          if-no-files-found: error

  # Publishes the packages of both OpenWrt releases (and, when signed, the
  # package indexes packages.adb / Packages.gz and the public keys
  # luci-apps.pem / luci-apps-opkg.pub) as one GitHub release: on every push to main,
  # tagged r<commit count> (e.g. r45), and on pushed v* tags. Published
  # releases are immutable, so re-running a build does not change them.
  release:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        env:
          REL_NUM: ${{ needs.build.outputs.release }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="r${REL_NUM}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Releasing $tag"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: luci-apps ${{ steps.version.outputs.tag }}
          files: dist/*
          make_latest: true
          overwrite_files: true
          generate_release_notes: true
